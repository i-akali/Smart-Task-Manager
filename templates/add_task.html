{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Add a New Task</h1>

<form action="/add" method="POST" class="card p-4 shadow-sm">

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" required>
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control"></textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Due Date</label>
        <input type="date" name="due_date" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control">
    </div>

    <div class="mb-3">
        <label class="form-label">Priority (0.0 to 1.0)</label>
        <input type="number" name="priority" step="0.1" min="0" max="1" class="form-control" required>
    </div>

    <button class="btn btn-primary">Add Task</button>
</form>

<a href="/tasks" class="btn btn-outline-secondary btn-sm mt-3">Back to Tasks</a>

{% endblock %}
