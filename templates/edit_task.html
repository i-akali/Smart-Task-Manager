{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Edit Task</h1>

<form action="/edit/{{ task[0] }}" method="POST" class="card p-4 shadow-sm">

    <div class="mb-3">
        <label class="form-label">Title</label>
        <input type="text" name="title" class="form-control" value="{{ task[1] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea name="description" class="form-control">{{ task[2] }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Due Date</label>
        <input type="date" name="due_date" class="form-control" value="{{ task[3] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Category</label>
        <input type="text" name="category" class="form-control" value="{{ task[4] }}">
    </div>

    <div class="mb-3">
        <label class="form-label">Priority</label>
        <input type="number" step="0.1" name="priority" class="form-control" value="{{ task[5] }}">
    </div>

    <button class="btn btn-primary">Save Changes</button>
</form>

<a href="/tasks" class="btn btn-outline-secondary btn-sm mt-3">Back to Tasks</a>

{% endblock %}
