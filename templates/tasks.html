{% extends "base.html" %}

{% block content %}
<h1 class="mb-4">Your Tasks</h1>

<div class="mb-3">
    <a href="/add" class="btn btn-primary btn-sm">Add New Task</a>
    <a href="/completed" class="btn btn-outline-secondary btn-sm ms-2">View Completed Tasks</a>
</div>

<ul class="list-group">
    {% for task in tasks %}
        <li class="list-group-item d-flex justify-content-between align-items-center">
            
            <div>
                <strong>{{ task[1] }}</strong>
                <div class="text-muted small">
                    Priority: {{ task[5] }}
                </div>
            </div>

            <div>
                {% if task[6] == 1 %}
                    <!-- Only show 'Completed' label if task has been completed -->
                    <span class="badge bg-success">Completed</span>
                {% else %}
                    <a href="/complete/{{ task[0] }}" class="btn btn-success btn-sm">Complete</a>
                {% endif %}

                <!-- Delete button will always be available -->
                <a href="/delete/{{ task[0] }}" class="btn btn-danger btn-sm ms-2">Delete</a>
                <a href="/edit/{{ task[0] }}" class="btn btn-outline-primary btn-sm ms-2">Edit</a>
            </div>

        </li>
    {% endfor %}
</ul>
{% endblock %}
